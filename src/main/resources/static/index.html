<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook Central Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        .top-navbar {
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 10px 20px;
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            font-weight: 600;
            border-radius: 8px;
            margin: 0 4px;
            padding: 8px 14px;
            transition: all 0.2s ease;
            font-size: 0.92rem;
        }
        .nav-pills .nav-link:hover {
            color: #f8fafc;
            background-color: #334155;
        }
        .nav-pills .nav-link.active {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
        .workspace-frame {
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            background-color: #ffffff;
        }
        .tab-content, .tab-pane {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

<header class="top-navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2 text-white">
        <i class="fa-solid fa-hospital-user text-primary fs-4"></i>
        <span class="fs-5 fw-bold tracking-wide">MediBook E-Channeling System</span>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills" id="moduleTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="reports-tab" data-bs-toggle="pill" data-bs-target="#reports-pane" type="button" role="tab">
                <i class="fa-solid fa-chart-line me-1"></i> Reports &amp; Analytics
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="appointments-tab" data-bs-toggle="pill" data-bs-target="#appointments-pane" type="button" role="tab">
                <i class="fa-solid fa-calendar-check me-1"></i> Appointments (Damsana)
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="schedule-tab" data-bs-toggle="pill" data-bs-target="#schedule-pane" type="button" role="tab">
                <i class="fa-solid fa-user-doctor me-1"></i> Doctor Scheduling (Hamdhan)
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="notifications-tab" data-bs-toggle="pill" data-bs-target="#notifications-pane" type="button" role="tab">
                <i class="fa-solid fa-bell me-1"></i> Notifications (Amasha)
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="database-tab" data-bs-toggle="pill" data-bs-target="#database-pane" type="button" role="tab">
                <i class="fa-solid fa-database me-1"></i> H2 Database
            </button>
        </li>
    </ul>
</header>

<!-- Embedded Tab Views -->
<div class="tab-content" id="moduleTabsContent">
    <div class="tab-pane fade show active" id="reports-pane" role="tabpanel">
        <iframe class="workspace-frame" src="/reports"></iframe>
    </div>
    <div class="tab-pane fade" id="appointments-pane" role="tabpanel">
        <iframe class="workspace-frame" src="/appointments.html"></iframe>
    </div>
    <div class="tab-pane fade" id="schedule-pane" role="tabpanel">
        <iframe class="workspace-frame" src="/doctor-schedule"></iframe>
    </div>
    <div class="tab-pane fade" id="notifications-pane" role="tabpanel">
        <iframe class="workspace-frame" src="/notifications"></iframe>
    </div>
    <div class="tab-pane fade" id="database-pane" role="tabpanel">
        <iframe class="workspace-frame" src="/h2-console"></iframe>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
