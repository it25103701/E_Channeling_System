<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; }
        .card-custom { border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-header-blue { background-color: #0d6efd; color: white; font-weight: 600; padding: 12px 20px; border-radius: 9px 9px 0 0; }
        .table thead th { background-color: #e2e8f0; color: #1e293b; font-weight: 600; border-bottom: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary fw-bold mb-1">Appointment Management</h2>
            <p class="text-muted mb-0">UC-01 &amp; UC-02: Patient Channeling &amp; Booking Management</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newBookingModal">
            <i class="fa-solid fa-plus me-1"></i> New Booking
        </button>
    </div>

    <!-- Active Appointments Table -->
    <div class="card card-custom">
        <div class="card-header-blue d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-calendar-check me-2"></i>Appointments Registry</span>
            <button class="btn btn-sm btn-light" onclick="fetchAppointments()">
                <i class="fa-solid fa-rotate-right me-1"></i> Refresh
            </button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Ref ID</th>
                        <th>Patient Name / ID</th>
                        <th>Doctor ID</th>
                        <th>Slot ID</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="appointmentsTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">Loading appointments...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- New Booking Modal -->
<div class="modal fade" id="newBookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fa-solid fa-calendar-plus me-2"></i>Create New Appointment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Patient Name</label>
                        <input type="text" id="patientName" class="form-control" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Patient ID</label>
                        <input type="text" id="patientId" class="form-control" value="demo-patient" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label fw-semibold">Doctor ID</label>
                            <input type="number" id="doctorId" class="form-control" value="1" required>
                        </div>
                        <div class="col">
                            <label class="form-label fw-semibold">Slot ID</label>
                            <input type="number" id="slotId" class="form-control" value="1" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Appointment Type</label>
                        <select id="appointmentType" class="form-select">
                            <option value="GENERAL_CONSULTATION">General Consultation</option>
                            <option value="FOLLOW_UP">Follow Up</option>
                            <option value="SPECIALIST">Specialist</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Notes</label>
                        <textarea id="notes" class="form-control" rows="2" placeholder="Symptoms or check-up notes..."></textarea>
                    </div>
                    <button type="button" class="btn btn-primary w-100 fw-semibold" onclick="createAppointment()">
                        Confirm &amp; Book Appointment
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function fetchAppointments() {
        const tbody = document.getElementById('appointmentsTableBody');
        try {
            const res = await fetch('/api/appointments');
            const data = await res.json();

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No appointments found. Click "New Booking" to create one.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(appt => `
                <tr>
                    <td class="fw-bold text-primary">${appt.bookingReference || ('#' + appt.id)}</td>
                    <td>${appt.patientName || appt.patientId || 'N/A'}</td>
                    <td>Doctor ${appt.doctorId || '1'}</td>
                    <td>Slot ${appt.slotId || '1'}</td>
                    <td><span class="badge bg-light text-dark border">${appt.appointmentType || 'CONSULTATION'}</span></td>
                    <td><span class="badge bg-${appt.status === 'CONFIRMED' ? 'success' : 'secondary'}">${appt.status || 'ACTIVE'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${appt.id})">
                            <i class="fa-solid fa-xmark me-1"></i> Cancel
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger">Failed to load appointments from /api/appointments</td></tr>';
        }
    }

    async function createAppointment() {
        const payload = {
            patientName: document.getElementById('patientName').value,
            patientId: document.getElementById('patientId').value,
            doctorId: parseInt(document.getElementById('doctorId').value),
            slotId: parseInt(document.getElementById('slotId').value),
            appointmentType: document.getElementById('appointmentType').value,
            notes: document.getElementById('notes').value
        };

        const res = await fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('newBookingModal')).hide();
            document.getElementById('bookingForm').reset();
            fetchAppointments();
        } else {
            alert('Failed to create appointment. Ensure doctor and slot exist.');
        }
    }

    async function cancelAppointment(id) {
        if (!confirm('Are you sure you want to cancel this appointment?')) return;
        const res = await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
        if (res.ok) {
            fetchAppointments();
        } else {
            alert('Failed to cancel appointment.');
        }
    }

    document.addEventListener('DOMContentLoaded', fetchAppointments);
</script>
</body>
</html>
