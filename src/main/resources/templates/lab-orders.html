<!-- Notification & Validation Feedback Banners -->
<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show my-3" role="alert">
    <i class="fas fa-exclamation-triangle me-2"></i>
    <strong class="me-1">Validation Error:</strong>
    <span th:text="${errorMessage}">Validation Error message</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show my-3" role="alert">
    <i class="fas fa-check-circle me-2"></i>
    <strong class="me-1">Success:</strong>
    <span th:text="${successMessage}">Operation successful</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
