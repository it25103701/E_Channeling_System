<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Insurance Claim</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; }
    </style>
</head>
<body>
<h2>Submit Insurance Claim</h2>
<form th:action="@{/insurance/claim}" th:object="${claim}" method="post">
    <label>Patient name</label>
    <input type="text" th:field="*{patientName}" required>

    <label>Appointment ID</label>
    <input type="number" th:field="*{appointmentId}" required>

    <label>Insurer name</label>
    <input type="text" th:field="*{insurerName}" required>

    <label>Policy number</label>
    <input type="text" th:field="*{policyNumber}" required>

    <label>Policy expiry date</label>
    <input type="date" th:field="*{policyExpiryDate}" required>

    <label>Remaining deductible balance (Rs.)</label>
    <input type="number" step="0.01" th:field="*{deductibleBalance}" required>

    <label>Channeling fee (Rs.)</label>
    <input type="number" step="0.01" th:field="*{channelingFee}" required>

    <button type="submit">Submit claim</button>
</form>
</body>
</html>
