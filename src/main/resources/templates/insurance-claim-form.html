<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Insurance Claim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/insurance.css}">
</head>
<body>
<div class="navbar">
    <span class="mark">✚</span>
    <span class="brand">MediBook Insurance</span>
    <a th:href="@{/insurance/claim/new}">New Claim</a>
    <a th:href="@{/insurance/admin/claims}">Admin Claims</a>
    <a th:href="@{/insurance/admin/audit-log}">Audit Log</a>
</div>
<div class="container">
    <div class="sheet">
        <h2>Pre-Authorisation Claim</h2>
        <p class="subtitle">Submit your policy details before your appointment, and we'll tell you exactly what you'll owe on the day.</p>
        <form th:action="@{/insurance/claim}" th:object="${claim}" method="post">
            <div class="form-grid">
                <div><label>Patient name</label><input type="text" th:field="*{patientName}" required></div>
                <div><label>Appointment ID</label><input type="number" th:field="*{appointmentId}" required></div>
                <div><label>Insurer name</label><input type="text" th:field="*{insurerName}" required></div>
                <div><label>Policy number</label><input type="text" th:field="*{policyNumber}" required></div>
                <div class="full"><label>Policy expiry date</label><input type="date" th:field="*{policyExpiryDate}" required></div>
                <div><label>Remaining deductible balance (Rs.)</label><input type="number" step="0.01" min="0" th:field="*{deductibleBalance}" required></div>
                <div><label>Channeling fee (Rs.)</label><input type="number" step="0.01" min="0" th:field="*{channelingFee}" required></div>
                <div class="full"><button type="submit" class="btn">Submit claim</button></div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
