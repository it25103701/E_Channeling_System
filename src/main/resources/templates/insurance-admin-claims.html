<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook ERP - Claims Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/insurance.css}">
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1 text-dark">Insurance Verification &amp; Claim Processing</h4>
        <div class="text-muted small">Claims register &bull; Review, approve or reject patient claims</div>
    </div>
    <div class="d-flex gap-2">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
            <i class="fas fa-circle text-success me-1" style="font-size: 0.55rem;"></i> System Online
        </span>
        <span class="badge bg-primary text-white px-3 py-2"><i class="fas fa-user-tie me-1"></i> Financial Admin</span>
    </div>
</div>

<nav class="nav nav-pills mb-4 gap-1">
    <a class="nav-link" th:href="@{/insurance/claim/new}">New Claim</a>
    <a class="nav-link active" th:href="@{/insurance/admin/claims}">Admin Claims</a>
    <a class="nav-link" th:href="@{/insurance/admin/audit-log}">Audit Log</a>
</nav>

<div class="surface-card">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0 text-dark">Claims Register</h6>
        <span class="badge bg-light text-secondary border">Real-time Claims</span>
    </div>
    <div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th class="ps-3">ID</th><th>Patient</th><th>Insurer</th><th>Policy</th><th>Expiry</th>
                <th>Balance</th><th>Fee</th><th>Coverage</th><th>Net payable</th>
                <th>Status</th><th>Reason</th><th class="pe-3">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(claims)}">
                <td colspan="12" class="text-center py-5 text-muted">
                    <i class="fas fa-inbox fa-3x mb-2 text-secondary opacity-50 d-block"></i>
                    No claims yet.
                </td>
            </tr>
            <tr th:each="c : ${claims}">
                <td class="ps-3 fw-bold text-secondary" th:text="'#' + ${c.id}"></td>
                <td th:text="${c.patientName}"></td>
                <td th:text="${c.insurerName}"></td>
                <td th:text="${c.policyNumber}"></td>
                <td th:text="${c.policyExpiryDate}"></td>
                <td th:text="${#numbers.formatDecimal(c.deductibleBalance, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${#numbers.formatDecimal(c.channelingFee, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${c.coveragePercentage} + '%'"></td>
                <td class="fw-semibold text-primary" th:text="${#numbers.formatDecimal(c.netPayable, 1, 'COMMA', 2, 'POINT')}"></td>
                <td><span class="status-badge" th:classappend="'st-' + ${c.status}" th:text="${c.status}"></span></td>
                <td class="text-muted" th:text="${c.rejectionReason}"></td>

                <td class="pe-3" th:if="${c.status == 'PENDING' or c.status == 'NEEDS_REVIEW'}">
                    <form th:action="@{/insurance/admin/claims/{id}/approve(id=${c.id})}" method="post" class="d-flex gap-1 mb-1">
                        <input type="number" name="coveragePercentage" min="0" max="100" step="0.1" placeholder="Coverage %" class="form-control form-control-sm" style="width: 110px;" required>
                        <button type="submit" class="btn btn-sm btn-outline-success" title="Approve"><i class="fas fa-check"></i></button>
                    </form>
                    <form th:action="@{/insurance/admin/claims/{id}/reject(id=${c.id})}" method="post" class="d-flex gap-1">
                        <input type="text" name="reason" placeholder="Reason" class="form-control form-control-sm" style="width: 110px;" required>
                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Reject"><i class="fas fa-xmark"></i></button>
                    </form>
                </td>
                <td class="pe-3" th:unless="${c.status == 'PENDING' or c.status == 'NEEDS_REVIEW'}">
                    <span class="badge bg-light text-muted border py-1 px-2 me-1"><i class="fas fa-check-double text-success"></i> Done</span>
                    <form th:action="@{/insurance/admin/claims/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Permanently delete this claim? This cannot be undone.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"><i class="fas fa-trash-can"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
