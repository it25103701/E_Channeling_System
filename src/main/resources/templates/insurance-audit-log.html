<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook ERP - Claim Audit Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/insurance.css}">
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1 text-dark">Insurance Verification &amp; Claim Processing</h4>
        <div class="text-muted small">Audit log &bull; Every approval, rejection and cancellation, most recent first</div>
    </div>
    <div class="d-flex gap-2">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
            <i class="fas fa-circle text-success me-1" style="font-size: 0.55rem;"></i> System Online
        </span>
        <span class="badge bg-primary text-white px-3 py-2"><i class="fas fa-user-tie me-1"></i> Financial Admin</span>
    </div>
</div>

<nav class="nav nav-pills mb-4 gap-1">
    <a class="nav-link" th:href="@{/insurance/claim/new}">New Claim</a>
    <a class="nav-link" th:href="@{/insurance/admin/claims}">Admin Claims</a>
    <a class="nav-link active" th:href="@{/insurance/admin/audit-log}">Audit Log</a>
</nav>

<div class="surface-card p-4" style="max-width: 760px;">
    <h6 class="fw-bold mb-3 text-dark"><i class="fas fa-clock-rotate-left text-primary me-2"></i>Claim Audit Log</h6>

    <div class="timeline">
        <p th:if="${#lists.isEmpty(logs)}" class="text-center text-muted py-4 mb-0">No actions recorded yet.</p>
        <div class="tl-entry" th:each="l : ${logs}" th:classappend="'a-' + ${l.action}">
            <div class="tl-time" th:text="${#temporals.format(l.actionTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
            <div class="tl-title" th:text="${l.action} + ' — Claim #' + ${l.claimId}"></div>
            <div class="tl-meta" th:text="${l.reason} + ' · by ' + ${l.actedBy}"></div>
        </div>
    </div>

    <div class="mt-4">
        <a class="btn btn-primary px-4" th:href="@{/insurance/admin/claims}"><i class="fas fa-arrow-left me-1"></i> Back to claims</a>
    </div>
</div>

</body>
</html>
