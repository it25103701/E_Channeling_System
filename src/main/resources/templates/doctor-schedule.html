<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Doctor Schedule</title>
</head>

<body>

<h1>Doctor Schedule Management</h1>

<form th:action="@{/doctor-schedule/save}"
      th:object="${doctorSchedule}"
      method="post">

    <input type="hidden"
           th:field="*{scheduleId}">

    <label>Doctor ID:</label>
    <input type="number"
           th:field="*{doctorId}">

    <span th:if="${#fields.hasErrors('doctorId')}"
          th:errors="*{doctorId}">
    </span>

    <br><br>

    <label>Consultation Date:</label>
    <input type="date"
           th:field="*{consultationDate}">

    <span th:if="${#fields.hasErrors('consultationDate')}"
          th:errors="*{consultationDate}">
    </span>

    <br><br>

    <label>Start Time:</label>
    <input type="time"
           th:field="*{startTime}">

    <span th:if="${#fields.hasErrors('startTime')}"
          th:errors="*{startTime}">
    </span>

    <br><br>

    <label>End Time:</label>
    <input type="time"
           th:field="*{endTime}">

    <span th:if="${#fields.hasErrors('endTime')}"
          th:errors="*{endTime}">
    </span>

    <br><br>

    <label>Slot Capacity:</label>
    <input type="number"
           th:field="*{slotCapacity}">

    <span th:if="${#fields.hasErrors('slotCapacity')}"
          th:errors="*{slotCapacity}">
    </span>

    <br><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option value="Available">Available</option>
        <option value="Blocked">Blocked</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <br><br>

    <button type="submit"
            th:if="${doctorSchedule.scheduleId == 0}">
        Add Schedule
    </button>

    <button type="submit"
            th:if="${doctorSchedule.scheduleId != 0}">
        Update Schedule
    </button>

    <a th:if="${doctorSchedule.scheduleId != 0}"
       th:href="@{/doctor-schedule}">
        Cancel Edit
    </a>

</form>

<br>

<hr>

<h2>Current Doctor Schedules</h2>

<table border="1">

    <thead>
    <tr>
        <th>Schedule ID</th>
        <th>Doctor ID</th>
        <th>Consultation Date</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>Slot Capacity</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="schedule : ${schedules}">

        <td th:text="${schedule.scheduleId}"></td>
        <td th:text="${schedule.doctorId}"></td>
        <td th:text="${schedule.consultationDate}"></td>
        <td th:text="${schedule.startTime}"></td>
        <td th:text="${schedule.endTime}"></td>
        <td th:text="${schedule.slotCapacity}"></td>
        <td th:text="${schedule.status}"></td>

        <td>

            <a th:href="@{/doctor-schedule/edit/{id}(id=${schedule.scheduleId})}">
                Edit
            </a>

            |

            <a th:if="${schedule.status != 'Cancelled'}"
               th:href="@{/doctor-schedule/cancel/{id}(id=${schedule.scheduleId})}">
                Cancel
            </a>

            <span th:if="${schedule.status == 'Cancelled'}">
                Cancelled
            </span>

            |

            <a th:href="@{/doctor-schedule/delete/{id}(id=${schedule.scheduleId})}">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
