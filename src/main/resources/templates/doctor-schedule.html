<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Schedule & Shift Slot Management</title>

    <!-- Connect CSS -->
    <link rel="stylesheet"
          th:href="@{/css/doctor-schedule.css}">
</head>

<body>

<div class="container">

    <!-- ============================= -->
    <!-- PAGE TITLE -->
    <!-- ============================= -->

    <h1 class="page-title">
        Doctor Schedule & Shift Slot Management
    </h1>


    <!-- ============================= -->
    <!-- ADD / UPDATE FORM -->
    <!-- ============================= -->

    <div class="card">

        <h2 th:text="${doctorSchedule.scheduleId == 0
                     ? 'Add Doctor Schedule'
                     : 'Update Doctor Schedule'}">
        </h2>

        <form th:action="@{/doctor-schedule/save}"
              th:object="${doctorSchedule}"
              method="post">

            <!-- Keep Schedule ID during update -->
            <input type="hidden"
                   th:field="*{scheduleId}">


            <div class="form-grid">

                <!-- Doctor ID -->
                <div class="form-group">

                    <label for="doctorId">
                        Doctor ID
                    </label>

                    <input id="doctorId"
                           type="number"
                           th:field="*{doctorId}"
                           min="1"
                           placeholder="Enter Doctor ID">

                    <span class="error-message"
                          th:if="${#fields.hasErrors('doctorId')}"
                          th:errors="*{doctorId}">
                    </span>

                </div>


                <!-- Consultation Date -->
                <div class="form-group">

                    <label for="consultationDate">
                        Consultation Date
                    </label>

                    <input id="consultationDate"
                           type="date"
                           th:field="*{consultationDate}">

                    <span class="error-message"
                          th:if="${#fields.hasErrors('consultationDate')}"
                          th:errors="*{consultationDate}">
                    </span>

                </div>


                <!-- Start Time -->
                <div class="form-group">

                    <label for="startTime">
                        Start Time
                    </label>

                    <input id="startTime"
                           type="time"
                           th:field="*{startTime}">

                    <span class="error-message"
                          th:if="${#fields.hasErrors('startTime')}"
                          th:errors="*{startTime}">
                    </span>

                </div>


                <!-- End Time -->
                <div class="form-group">

                    <label for="endTime">
                        End Time
                    </label>

                    <input id="endTime"
                           type="time"
                           th:field="*{endTime}">

                    <span class="error-message"
                          th:if="${#fields.hasErrors('endTime')}"
                          th:errors="*{endTime}">
                    </span>

                </div>


                <!-- Slot Capacity -->
                <div class="form-group">

                    <label for="slotCapacity">
                        Slot Capacity
                    </label>

                    <input id="slotCapacity"
                           type="number"
                           th:field="*{slotCapacity}"
                           min="1"
                           placeholder="Enter Slot Capacity">

                    <span class="error-message"
                          th:if="${#fields.hasErrors('slotCapacity')}"
                          th:errors="*{slotCapacity}">
                    </span>

                </div>


                <!-- Status -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status"
                            th:field="*{status}">

                        <option value="Available">
                            Available
                        </option>

                        <option value="Blocked">
                            Blocked
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>


            <!-- Form Buttons -->
            <div class="form-actions">

                <!-- Add -->
                <button type="submit"
                        class="btn btn-primary"
                        th:if="${doctorSchedule.scheduleId == 0}">
                    Add Schedule
                </button>


                <!-- Update -->
                <button type="submit"
                        class="btn btn-primary"
                        th:if="${doctorSchedule.scheduleId != 0}">
                    Update Schedule
                </button>


                <!-- Cancel Edit -->
                <a class="btn btn-secondary"
                   th:if="${doctorSchedule.scheduleId != 0}"
                   th:href="@{/doctor-schedule}">
                    Cancel Edit
                </a>

            </div>

        </form>

    </div>


    <!-- ============================= -->
    <!-- CURRENT SCHEDULES -->
    <!-- ============================= -->

    <div class="card">

        <h2>
            Current Doctor Schedules
        </h2>

        <div class="table-responsive">

            <table class="schedule-table">

                <thead>

                <tr>

                    <th>Schedule ID</th>

                    <th>Doctor ID</th>

                    <th>Consultation Date</th>

                    <th>Start Time</th>

                    <th>End Time</th>

                    <th>Slot Capacity</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody>

                <!-- Schedule Rows -->
                <tr th:each="schedule : ${schedules}">

                    <td th:text="${schedule.scheduleId}">
                    </td>

                    <td th:text="${schedule.doctorId}">
                    </td>

                    <td th:text="${schedule.consultationDate}">
                    </td>

                    <td th:text="${schedule.startTime}">
                    </td>

                    <td th:text="${schedule.endTime}">
                    </td>

                    <td th:text="${schedule.slotCapacity}">
                    </td>


                    <!-- Status -->
                    <td>

                        <span class="status"
                              th:classappend="${schedule.status == 'Available'}
                                      ? ' status-available'
                                      : (${schedule.status == 'Blocked'}
                                      ? ' status-blocked'
                                      : ' status-cancelled')"
                              th:text="${schedule.status}">
                        </span>

                    </td>


                    <!-- Actions -->
                    <td>

                        <div class="action-buttons">

                            <!-- Edit -->
                            <a class="btn btn-edit"
                               th:href="@{/doctor-schedule/edit/{id}
                               (id=${schedule.scheduleId})}">
                                Edit
                            </a>


                            <!-- Cancel -->
                            <a class="btn btn-cancel"
                               th:if="${schedule.status != 'Cancelled'}"
                               th:href="@{/doctor-schedule/cancel/{id}
                               (id=${schedule.scheduleId})}">
                                Cancel
                            </a>


                            <!-- Already Cancelled -->
                            <span class="btn btn-secondary"
                                  th:if="${schedule.status == 'Cancelled'}">
                                Cancelled
                            </span>


                            <!-- Delete -->
                            <a class="btn btn-delete"
                               th:href="@{/doctor-schedule/delete/{id}
                               (id=${schedule.scheduleId})}">
                                Delete
                            </a>

                        </div>

                    </td>

                </tr>


                <!-- No Records -->
                <tr th:if="${#lists.isEmpty(schedules)}">

                    <td colspan="8"
                        class="empty-message">

                        No doctor schedules available.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
